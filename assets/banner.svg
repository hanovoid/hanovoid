<svg width="1200" height="280" viewBox="0 0 1200 280" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0B1120"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <radialGradient id="glowLeft" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(210 140) rotate(25) scale(360 220)">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowRight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1010 70) rotate(140) scale(380 220)">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentLine" x1="120" y1="0" x2="1080" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0"/>
      <stop offset="25%" stop-color="#818CF8" stop-opacity="0.75"/>
      <stop offset="55%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="85%" stop-color="#E2E8F0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="logoGrad" x1="0" y1="0" x2="88" y2="88" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>

    <linearGradient id="titleGrad" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="65%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Base container -->
  <rect x="1" y="1" width="1198" height="278" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Subtle architectural grid -->
  <rect x="2" y="2" width="1196" height="276" rx="17" fill="url(#grid)"/>

  <!-- Ambient glows -->
  <rect x="2" y="2" width="1196" height="276" rx="17" fill="url(#glowLeft)"/>
  <rect x="2" y="2" width="1196" height="276" rx="17" fill="url(#glowRight)"/>

  <!-- Top & bottom hairline highlights -->
  <line x1="120" y1="2" x2="1080" y2="2" stroke="url(#accentLine)" stroke-width="1.5"/>
  <line x1="200" y1="278" x2="1000" y2="278" stroke="url(#accentLine)" stroke-width="1" opacity="0.65"/>

  <!-- Corner telemetry ticks -->
  <path d="M 30 42 L 30 28 L 44 28" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 1170 42 L 1170 28 L 1156 28" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 30 238 L 30 252 L 44 252" stroke="#334155" stroke-width="1.5" fill="none"/>
  <path d="M 1170 238 L 1170 252 L 1156 252" stroke="#334155" stroke-width="1.5" fill="none"/>

  <!-- Geometric Novoid Emblem -->
  <g transform="translate(88, 92)">
    <rect x="0" y="0" width="96" height="96" rx="22" fill="#0F172A" stroke="url(#logoGrad)" stroke-width="1.75"/>
    <rect x="8" y="8" width="80" height="80" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1"/>
    <path d="M 30 68 V 28 L 66 68 V 28" stroke="url(#logoGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="66" cy="28" r="3.5" fill="#38BDF8"/>
  </g>

  <!-- Status Pill -->
  <g transform="translate(216, 74)">
    <rect x="0" y="0" width="236" height="26" rx="13" fill="#0F172A" stroke="#1E293B" stroke-width="1"/>
    <circle cx="16" cy="13" r="4" fill="#38BDF8"/>
    <text x="29" y="17" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">NOVOID TECH  ·  EST. 2011</text>
  </g>

  <!-- Main Name -->
  <text x="214" y="152" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="50" font-weight="800" letter-spacing="-0.8">Novoid Hà</text>

  <!-- Subtitle -->
  <text x="216" y="186" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="15" font-weight="500" letter-spacing="3.2">SYSTEMS  ·  AI INFRASTRUCTURE  ·  REVERSE ENGINEERING</text>

  <!-- Bottom rule & tags -->
  <line x1="216" y1="208" x2="760" y2="208" stroke="#1E293B" stroke-width="1"/>
  <text x="216" y="230" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="0.8">rust  //  axum  //  http/2  //  llm-routing  //  bytecode-analysis</text>

  <!-- Right subtle architectural rings -->
  <g transform="translate(1055, 140)" opacity="0.55">
    <circle cx="0" cy="0" r="66" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="0" cy="0" r="44" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="18" stroke="#38BDF8" stroke-width="1.2" stroke-opacity="0.6"/>
    <circle cx="0" cy="0" r="4" fill="#A5B4FC"/>
  </g>
</svg>
